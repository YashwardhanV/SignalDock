services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-signaldock}
      POSTGRES_USER: ${POSTGRES_USER:-signaldock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signaldock}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - signaldock_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-signaldock} -d ${POSTGRES_DB:-signaldock}"]
      interval: 5s
      timeout: 3s
      retries: 15

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-signaldock}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-signaldock}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-signaldock}
      SPRING_PROFILES_ACTIVE: demo
      APP_API_KEY: ${APP_API_KEY:-sd_demo_local_key}
      APP_DEMO_RECEIVER_URL: http://backend:8080/api/v1/demo/receiver/success
      APP_DEMO_FAILURE_URL: http://backend:8080/api/v1/demo/receiver/failure
      APP_DELIVERY_CONNECT_TIMEOUT: ${DELIVERY_CONNECT_TIMEOUT:-2s}
      APP_DELIVERY_READ_TIMEOUT: ${DELIVERY_READ_TIMEOUT:-4s}
      APP_DELIVERY_BATCH_SIZE: ${DELIVERY_BATCH_SIZE:-20}
      APP_DELIVERY_POLL_DELAY: ${DELIVERY_POLL_DELAY:-100}
      APP_DELIVERY_LEASE_DURATION: ${DELIVERY_LEASE_DURATION:-30s}
      APP_DELIVERY_RETRY_BASE_DELAY: ${RETRY_BASE_DELAY:-250ms}
      APP_DELIVERY_RETRY_MAX_DELAY: ${RETRY_MAX_DELAY:-1s}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  signaldock_postgres:
