server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: signaldock
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/signaldock}
    username: ${SPRING_DATASOURCE_USERNAME:signaldock}
    password: ${SPRING_DATASOURCE_PASSWORD:signaldock}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs

app:
  api-key: ${APP_API_KEY:sd_demo_local_key}
  cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  delivery:
    connect-timeout: ${APP_DELIVERY_CONNECT_TIMEOUT:2s}
    read-timeout: ${APP_DELIVERY_READ_TIMEOUT:4s}
    batch-size: ${APP_DELIVERY_BATCH_SIZE:20}
    # Milliseconds: @Scheduled consumes this property directly as a number.
    poll-delay: ${APP_DELIVERY_POLL_DELAY:500}
    lease-duration: ${APP_DELIVERY_LEASE_DURATION:30s}
    retry-base-delay: ${APP_DELIVERY_RETRY_BASE_DELAY:30s}
    retry-max-delay: ${APP_DELIVERY_RETRY_MAX_DELAY:1h}
    allow-http: ${APP_DELIVERY_ALLOW_HTTP:false}
    allow-private-networks: ${APP_DELIVERY_ALLOW_PRIVATE_NETWORKS:false}
  demo:
    enabled: false
    receiver-url: ${APP_DEMO_RECEIVER_URL:http://localhost:8080/api/v1/demo/receiver/success}
    failure-url: ${APP_DEMO_FAILURE_URL:http://localhost:8080/api/v1/demo/receiver/failure}
